    - heading "Terms of Beta-testing" [level=1] [ref=f1e6]
    - heading "Purpose" [level=2] [ref=f1e7]
    - list [ref=f1e8]:
      - listitem [ref=f1e9]: This is a provisional service for the development and demonstration of biset.
      - listitem [ref=f1e10]:
        - text: To report issues, please contact
        - link "biset@duck.com" [ref=f1e11] [cursor=pointer]:
          - /url: mailto:biset@duck.com
        - text: .
    - heading "Disclaimers" [level=2] [ref=f1e12]
    - list [ref=f1e13]:
      - listitem [ref=f1e14]: The service may be terminated at any time without notice at the developer's discretion.
      - listitem [ref=f1e15]: Accounts inactive for more than two weeks will be automatically deleted. Accounts may also be deleted without notice for other reasons (Really sorry in advance).
      - listitem [ref=f1e16]: The developer assumes no responsibility for any consequences arising from use of the service.
    - heading "Privacy Policy" [level=2] [ref=f1e17]
    - list [ref=f1e18]:
      - listitem [ref=f1e19]: "For email: if the recipient supports OpenPGP, end-to-end encryption is applied automatically (DeltaChat-like). Otherwise, messages are transmitted in plaintext but are always stored encrypted on the server (Proton-like)."
      - listitem [ref=f1e20]: "For ActivityPub: messages are transmitted in plaintext but are always stored encrypted on the server (Proton-like)."
      - listitem [ref=f1e21]: Email addresses and metadata are technically accessible to the administrator.
      - listitem [ref=f1e22]: None of the above data will be shared with third parties. Upon termination of the service, all data will be promptly deleted.
    - heading "What's Included" [level=2] [ref=f1e23]
    - list [ref=f1e24]:
      - listitem [ref=f1e25]: 500 MB of message storage
      - listitem [ref=f1e26]: Unlimited ActivityPub send and receive
      - listitem [ref=f1e27]: Unlimited email receive
      - listitem [ref=f1e28]: Email sending is limited to replies to known addresses (sending to unknown addresses is not supported)
      - listitem [ref=f1e29]: DeltaChat interoperability via invite link (known compatibility issues with some servers)