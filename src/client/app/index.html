<script>
/* Home-screen-app (standalone) detection. iOS launched via the legacy
   apple-mobile-web-app-capable meta (we have no web manifest) does NOT match
   @media (display-mode: standalone) — it exposes navigator.standalone instead.
   Set a class so the notch/Dynamic-Island CSS keys off this, not the unreliable
   media query. Runs in <head> before first paint, so no layout flash. */
if (navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)) {
  document.documentElement.classList.add('pwa-standalone');
}
</script>

<body>



<div id="sys-msg-root"></div>

<div id="lp-hamburger-menu">
  <button class="lp-hmenu-item" data-page="/account">account</button>
  <button class="lp-hmenu-item" data-page="/config">config</button>
</div>

<div id="app" style="display:none">
  <aside id="left-pane">
    <div id="left-pane-header">
      <button id="main-toggle" aria-label="Toggle pane">
        <svg class="lp-ico-split" width="16" height="16" viewBox="0 0 16 16">
          <path d="M5.5 1.5H4A2.5 2.5 0 0 0 1.5 4v8A2.5 2.5 0 0 0 4 14.5h1.5z" fill="currentColor" opacity="0.65"/>
          <rect x="1.5" y="1.5" width="13" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <line x1="5.5" y1="1.5" x2="5.5" y2="14.5" stroke="currentColor" stroke-width="1" opacity="0.5"/>
        </svg>
        <svg class="lp-ico-right" width="16" height="16" viewBox="0 0 16 16">
          <rect x="1.5" y="1.5" width="13" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <line x1="5.5" y1="1.5" x2="5.5" y2="14.5" stroke="currentColor" stroke-width="1" opacity="0.5"/>
        </svg>
      </button>
      <div id="lp-search-wrap">
        <input id="lp-search" type="search" placeholder="/ for commands" autocomplete="off">
      </div>
      <button id="lp-hamburger-left" aria-label="menu">
        <img id="lp-hamburger-left-avatar" alt="">
        <span id="lp-hamburger-left-initials"></span>
        <svg id="lp-hamburger-left-icon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <circle cx="8" cy="3.5" r="1.5"/>
          <circle cx="8" cy="8" r="1.5"/>
          <circle cx="8" cy="12.5" r="1.5"/>
        </svg>
      </button>
    </div>
    <div id="lp-new-wrap" style="display:none">
      <div id="lp-new-inner">
        <input id="lp-new-input" type="text" placeholder="Recipient (e.g. alice, user@example.com)">
        <button id="lp-new-cancel">✕</button>
      </div>
    </div>
    <div id="left-list-wrap">
      <div id="lp-commands" style="display:none"></div>
      <div id="left-list"></div>
      <div id="lp-empty" style="display:none">No conversations yet</div>
      <div id="lp-new-suggestions"></div>
      <div id="lp-search-results"></div>
    </div>
    <div id="lp-resize-handle"></div>
  </aside>
  <button id="lp-compose-fab" class="compose-fab" type="button" aria-label="Compose" title="Compose"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
  <div id="lp-inbox-menu">
    <div class="menu-item" id="lp-archive-inbox-btn">Archive</div>
    <div class="menu-item" id="lp-export-inbox-btn">Export as JSON</div>
    <div class="menu-item danger" id="lp-delete-inbox-btn">Delete inbox</div>
  </div>
  <div id="right-col">
    <div id="outer">
      <div id="past-threads"></div>
      <div id="thread-title-row">
        <button id="main-toggle-right" aria-label="Toggle pane">
          <svg class="lp-ico-split" width="16" height="16" viewBox="0 0 16 16">
            <path d="M5.5 1.5H4A2.5 2.5 0 0 0 1.5 4v8A2.5 2.5 0 0 0 4 14.5h1.5z" fill="currentColor" opacity="0.65"/>
            <rect x="1.5" y="1.5" width="13" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
            <line x1="5.5" y1="1.5" x2="5.5" y2="14.5" stroke="currentColor" stroke-width="1" opacity="0.5"/>
          </svg>
          <svg class="lp-ico-right" width="16" height="16" viewBox="0 0 16 16">
            <rect x="1.5" y="1.5" width="13" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
            <line x1="5.5" y1="1.5" x2="5.5" y2="14.5" stroke="currentColor" stroke-width="1" opacity="0.5"/>
          </svg>
        </button>
        <div id="header-left">
          <span id="header-group-icon" style="display:none;color:var(--text);flex-shrink:0;line-height:0;margin-right:2px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
          <span id="header-thread-title"></span>
        </div>
        <div id="header-right">
          <button id="lp-hamburger" aria-label="menu">
            <img id="lp-hamburger-avatar" alt="">
            <span id="lp-hamburger-initials"></span>
            <svg id="lp-hamburger-icon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
              <circle cx="8" cy="3.5" r="1.5"/>
              <circle cx="8" cy="8" r="1.5"/>
              <circle cx="8" cy="12.5" r="1.5"/>
            </svg>
          </button>
        </div>
      </div>
      <div id="right-pane">
        <div id="cmd-page-header">
          <button id="main-toggle-cmd" aria-label="Toggle pane">
            <svg class="lp-ico-split" width="16" height="16" viewBox="0 0 16 16">
              <path d="M5.5 1.5H4A2.5 2.5 0 0 0 1.5 4v8A2.5 2.5 0 0 0 4 14.5h1.5z" fill="currentColor" opacity="0.65"/>
              <rect x="1.5" y="1.5" width="13" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
              <line x1="5.5" y1="1.5" x2="5.5" y2="14.5" stroke="currentColor" stroke-width="1" opacity="0.5"/>
            </svg>
            <svg class="lp-ico-right" width="16" height="16" viewBox="0 0 16 16">
              <rect x="1.5" y="1.5" width="13" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
              <line x1="5.5" y1="1.5" x2="5.5" y2="14.5" stroke="currentColor" stroke-width="1" opacity="0.5"/>
            </svg>
          </button>
          <span id="cmd-page-title"></span>
          <button id="cmd-page-avatar-btn" aria-label="menu">
            <img id="cmd-page-avatar-img" alt="">
            <span id="cmd-page-avatar-initials"></span>
          </button>
        </div>
        <div id="cmd-page"></div>
        <div id="conv-meta">
          <div id="conv-fields">
            <div id="conv-to"><span id="conv-did"></span><span id="conv-via"></span></div>
            <div id="conv-cc"></div>
            <div id="conv-bcc"></div>
          </div>
          <div id="conv-meta-expanded"></div>
        </div>
        <div id="page-host" style="display:contents"></div>
        <div id="scroll-spacer"></div>
      </div>
    </div>
    <div id="reply-dock"></div>
  </div>
</div>
<button id="scroll-to-top" aria-label="Scroll to top">
  <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
    <path d="M8 5.5L13.5 11h-11L8 5.5z"/>
  </svg>
</button>
<button id="scroll-to-bottom" aria-label="Scroll to bottom">
  <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
    <path d="M8 10.5L2.5 5h11L8 10.5z"/>
  </svg>
</button>

<script type="module" src="./main.ts"></script>
</body>
</html>
