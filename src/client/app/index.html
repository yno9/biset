<script>
/* Home-screen-app (standalone) detection. iOS launched via the legacy
   apple-mobile-web-app-capable meta (we have no web manifest) does NOT match
   @media (display-mode: standalone) — it exposes navigator.standalone instead.
   Set a class so the notch/Dynamic-Island CSS keys off this, not the unreliable
   media query. Runs in <head> before first paint, so no layout flash. */
if (navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)) {
  document.documentElement.classList.add('pwa-standalone');
}
</script>

<script>
/* The web fonts (Recursive, Noto Sans, Noto Sans JP) are served from this app's own host (/fonts, put there by the build), and added from script,
   not as a <link> in the markup: a stylesheet link in the head holds the first paint until it has loaded. Added like this, the page draws at once in
   the fallback fonts and the web fonts swap in. From a file:// copy there is no /fonts, and the system fonts are used. */
if (location.protocol !== 'file:') {
  const link = document.createElement('link');
  link.rel = 'stylesheet'; link.href = '/fonts/fonts.css';
  document.head.appendChild(link);
}
</script>
<link rel="stylesheet" href="./style.css">
</head>

<div id="root"></div>

<script type="module">
/* Add ?debug to the address for an on-page console (eruda), for a phone that has no inspector. It is in the build, but loaded only then. */
if (new URLSearchParams(location.search).has('debug')) import('eruda').then(({ default: eruda }) => eruda.init())
</script>
<script type="module" src="./main.ts"></script>
</body>
