<!DOCTYPE html>
<!-- Dev only (not part of the build): Roboto Flex, a variable font with thirteen axes, to try a text on all of them. Open /robotflex.html.
     The font comes from Google Fonts here; the app would embed the instance chosen. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>roboto flex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,slnt,wdth,wght,GRAD,XOPQ,XTRA,YOPQ,YTAS,YTDE,YTFI,YTLC,YTUC@8..144,-10..0,25..151,100..1000,-200..150,27..175,323..603,25..135,649..854,-305..-98,560..788,416..570,528..760&family=Outfit:wght@100..900&display=swap">
<style>
  body { margin: 1.5rem; font: 0.875rem/1.4 system-ui, sans-serif; color: #1c1c1e; background: #fff; }
  body.dark { color: #f2f2f7; background: #1c1c1e; }
  .bar { display: flex; flex-wrap: wrap; gap: 0.75rem 1.5rem; align-items: center; margin-bottom: 1rem; }
  .bar label { display: flex; align-items: center; gap: 0.5rem; }
  input[type="text"] { width: 14rem; font: inherit; padding: 0.25rem 0.5rem; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 20rem; gap: 2rem; align-items: start; }
  @media (max-width: 52rem) { .layout { grid-template-columns: 1fr; } }
  .preview { position: sticky; top: 1rem; padding: 1rem 0; }
  .sample { display: block; overflow: hidden; white-space: nowrap; line-height: 1.2; font-family: "Roboto Flex", sans-serif; font-optical-sizing: none; font-size: var(--size, 6rem); font-variation-settings: var(--fvs); }
  .sample .co { color: var(--co, inherit); }
  pre { margin: 1rem 0 0; padding: 0.5rem 0.75rem; border-radius: 0.5rem; background: rgba(128, 128, 128, 0.12); white-space: pre-wrap; font: 0.75rem/1.5 ui-monospace, monospace; user-select: all; }
  .axes { display: grid; gap: 0.5rem; }
  .axis { display: grid; grid-template-columns: 3.5rem 1fr 3.5rem; gap: 0.5rem; align-items: center; }
  .axis b { font: 600 0.75rem ui-monospace, monospace; }
  .axis output { text-align: right; font: 0.75rem ui-monospace, monospace; color: #888; }
  .axis small { grid-column: 1 / -1; margin-top: -0.25rem; color: #888; font-size: 0.6875rem; }
  button { font: inherit; padding: 0.25rem 0.75rem; border: 1px solid rgba(128, 128, 128, 0.4); border-radius: 0.5rem; background: none; color: inherit; cursor: pointer; }
  h2 { margin: 2rem 0 0.5rem; font-size: 0.875rem; }
  .strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr)); gap: 0.5rem 1.5rem; }
  .strip div { overflow: hidden; }
  .strip small { display: block; color: #888; font: 0.6875rem ui-monospace, monospace; }
  .strip .sample { font-size: 2.5rem; }
  .presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(20rem, 1fr)); gap: 1rem 1.5rem; }
  .preset { padding: 0.75rem 1rem; border: 1px solid rgba(128, 128, 128, 0.25); border-radius: 0.75rem; }
  .preset small { display: block; color: #888; font: 0.6875rem/1.5 ui-monospace, monospace; }
  .preset .sample { font-size: 4rem; }
  .preset .outfit { font-family: "Outfit", sans-serif; font-variation-settings: normal; font-optical-sizing: auto; }
  .preset button { margin-top: 0.5rem; }
</style>
</head>
<body>
<div class="bar">
  <label>text <input id="text" type="text" value="commail"></label>
  <label>size <input id="size" type="range" min="2" max="12" step="0.25" value="6"><output id="sizeOut">6</output>rem</label>
  <label>letter-spacing <input id="tracking" type="range" min="-0.15" max="0.1" step="0.005" value="0"><output id="trackingOut">0</output>em</label>
  <label><input id="tint" type="checkbox"> tint the first two letters</label>
  <label><input id="dark" type="checkbox"> dark</label>
  <button id="reset" type="button">reset the axes</button>
</div>
<div class="layout">
  <div class="preview">
    <span class="sample" id="sample"></span>
    <pre id="css"></pre>
  </div>
  <div class="axes" id="axes"></div>
</div>
<h2>close to Outfit: Roboto Flex set round and wide (above each, Outfit at the same weight, below it)</h2>
<div class="presets" id="presets"></div>
<h2>weight, the other axes as set</h2>
<div class="strip" id="weights"></div>
<h2>width, the other axes as set</h2>
<div class="strip" id="widths"></div>
<script>
  // [tag, name, min, max, default, what it does]: Roboto Flex's thirteen axes.
  const AXES = [
    ['wght', 'Weight', 100, 1000, 400, 'thin to black'],
    ['wdth', 'Width', 25, 151, 100, 'narrow to wide'],
    ['opsz', 'Optical size', 8, 144, 14, 'small text to display: finer details as it grows'],
    ['GRAD', 'Grade', -200, 150, 0, 'weight of the strokes without changing the widths of the letters'],
    ['slnt', 'Slant', -10, 0, 0, 'leaning to the right'],
    ['XOPQ', 'Thick stroke', 27, 175, 96, 'the thickness of the vertical strokes'],
    ['YOPQ', 'Thin stroke', 25, 135, 79, 'the thickness of the horizontal strokes'],
    ['XTRA', 'Counter width', 323, 603, 468, 'the space inside and between letters, horizontally'],
    ['YTLC', 'Lowercase height', 416, 570, 514, 'the height of the lowercase letters'],
    ['YTUC', 'Uppercase height', 528, 760, 712, 'the height of the capitals'],
    ['YTAS', 'Ascender height', 649, 854, 750, 'the height of b, d, l'],
    ['YTDE', 'Descender depth', -305, -98, -203, 'the depth of g, p, y'],
    ['YTFI', 'Figure height', 560, 788, 738, 'the height of the digits'],
  ]
  // Settings that bring Roboto Flex toward Outfit: wider, a taller x-height (so that c and o come near circles), strokes of one thickness, the counters as they are.
  // Each is a change to the defaults; the sliders can take any of them to go on from there.
  const PRESETS = [
    ['Round 400', { wght: 400, wdth: 125, opsz: 24, XOPQ: 90, YOPQ: 86, YTLC: 556 }],
    ['Round 500', { wght: 500, wdth: 125, opsz: 24, XOPQ: 96, YOPQ: 92, YTLC: 556 }],
    ['Round 600', { wght: 600, wdth: 128, opsz: 20, XOPQ: 98, YOPQ: 94, YTLC: 560, XTRA: 480 }],
    ['Round 700, wide', { wght: 700, wdth: 135, opsz: 16, XOPQ: 98, YOPQ: 96, YTLC: 566, XTRA: 490 }],
    ['Compact 500', { wght: 500, wdth: 108, opsz: 32, XOPQ: 94, YOPQ: 90, YTLC: 548 }],
    ['Wide 800', { wght: 800, wdth: 145, opsz: 12, XOPQ: 100, YOPQ: 98, YTLC: 570, XTRA: 500 }],
  ]
  const $ = id => document.getElementById(id)
  const values = Object.fromEntries(AXES.map(([tag, , , , initial]) => [tag, initial]))
  const settings = (overrides = {}) => AXES.map(([tag]) => `"${tag}" ${overrides[tag] ?? values[tag]}`).join(', ')

  const sliders = {}
  for (const [tag, name, min, max, initial, note] of AXES) {
    const row = document.createElement('div')
    row.className = 'axis'
    const label = Object.assign(document.createElement('b'), { textContent: tag })
    label.title = name
    const input = Object.assign(document.createElement('input'), { type: 'range', min, max, step: tag === 'slnt' ? 0.5 : 1, value: initial })
    const out = document.createElement('output')
    const hint = Object.assign(document.createElement('small'), { textContent: `${name}: ${note} (${min}–${max})` })
    input.addEventListener('input', () => { values[tag] = Number(input.value); draw() })
    sliders[tag] = { input, out }
    row.append(label, input, out, hint)
    $('axes').append(row)
  }

  const fill = (host, text, key, steps) => {
    host.replaceChildren()
    for (const step of steps) {
      const cell = document.createElement('div')
      const caption = Object.assign(document.createElement('small'), { textContent: `${key} ${step}` })
      const sample = document.createElement('span')
      sample.className = 'sample'
      sample.style.setProperty('--fvs', settings({ [key]: step }))
      sample.textContent = text
      cell.append(caption, sample)
      host.append(cell)
    }
  }

  function drawPresets(text) {
    const host = $('presets')
    host.replaceChildren()
    for (const [name, changes] of PRESETS) {
      const card = document.createElement('div')
      card.className = 'preset'
      const flex = document.createElement('span')
      flex.className = 'sample'
      flex.style.setProperty('--fvs', settings(Object.fromEntries(AXES.map(([tag, , , , initial]) => [tag, changes[tag] ?? initial]))))
      flex.textContent = text
      const outfit = document.createElement('span')
      outfit.className = 'sample outfit'
      outfit.style.fontWeight = String(changes.wght)
      outfit.textContent = text
      const caption = Object.assign(document.createElement('small'), { textContent: `Roboto Flex · ${name} · ${Object.entries(changes).map(([tag, value]) => `${tag} ${value}`).join(', ')}` })
      const reference = Object.assign(document.createElement('small'), { textContent: `Outfit ${changes.wght}` })
      const load = Object.assign(document.createElement('button'), { type: 'button', textContent: 'load into the sliders' })
      load.addEventListener('click', () => { for (const [tag, , , , initial] of AXES) values[tag] = changes[tag] ?? initial; draw(); window.scrollTo({ top: 0, behavior: 'smooth' }) })
      card.append(caption, flex, reference, outfit, load)
      host.append(card)
    }
  }

  function draw() {
    const text = $('text').value || 'commail'
    document.body.classList.toggle('dark', $('dark').checked)
    document.body.style.setProperty('--size', `${$('size').value}rem`)
    document.body.style.setProperty('--co', $('tint').checked ? '#0083ff' : 'inherit')
    $('sizeOut').textContent = $('size').value
    $('trackingOut').textContent = $('tracking').value
    const sample = $('sample')
    sample.style.setProperty('--fvs', settings())
    sample.style.letterSpacing = `${$('tracking').value}em`
    sample.replaceChildren(Object.assign(document.createElement('span'), { className: 'co', textContent: text.slice(0, 2) }), text.slice(2))
    for (const [tag] of AXES) { sliders[tag].input.value = values[tag]; sliders[tag].out.textContent = values[tag] }
    $('css').textContent = `font-family: "Roboto Flex";\nfont-optical-sizing: none;\nfont-variation-settings: ${settings()};` + ($('tracking').value === '0' ? '' : `\nletter-spacing: ${$('tracking').value}em;`)
    drawPresets(text)
    fill($('weights'), text, 'wght', [100, 200, 300, 400, 500, 600, 700, 800, 900, 1000])
    fill($('widths'), text, 'wdth', [25, 50, 75, 100, 125, 151])
  }
  for (const id of ['text', 'size', 'tracking', 'tint', 'dark']) $(id).addEventListener('input', draw)
  $('reset').addEventListener('click', () => { for (const [tag, , , , initial] of AXES) values[tag] = initial; draw() })
  draw()
</script>
</body>
</html>
